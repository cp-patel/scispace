<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" font-family="Inter, Helvetica, Arial, sans-serif" role="img">
  <title>Detailed architecture of the scientific literature review system</title>
  <desc>A detailed end-to-end diagram showing candidate discovery, citation graph ranking, Bayesian screening, diverse paper selection, evidence-grounded parallel writing, citation verification, output, and the API-worker-Postgres runtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9db8de"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#65b4ff"/></marker>
    <style>
      .bg{fill:#101d35}.panel{fill:#152947;stroke:#3d5b83;stroke-width:1.5}.card{fill:#203c64;stroke:#5476a4;stroke-width:1.4}.card2{fill:#192f50;stroke:#5476a4;stroke-width:1.4}.accent{fill:#174c72;stroke:#65b4ff;stroke-width:1.5}.human{fill:#493d25;stroke:#f2c66d;stroke-width:1.4}.title{fill:#fff;font-size:31px;font-weight:700}.subtitle{fill:#b4c7e2;font-size:15px}.section{fill:#fff;font-size:19px;font-weight:700}.heading{fill:#fff;font-size:16px;font-weight:700}.body{fill:#d4e0f1;font-size:13px}.small{fill:#b4c7e2;font-size:11.5px}.tiny{fill:#a8bdd8;font-size:10.5px}.metric{fill:#81c7ff;font-size:13px;font-weight:700}.line{fill:none;stroke:#9db8de;stroke-width:2;marker-end:url(#arrow)}.lineblue{fill:none;stroke:#65b4ff;stroke-width:2.2;marker-end:url(#arrow-blue)}.dash{fill:none;stroke:#7291b7;stroke-width:1.4;stroke-dasharray:7 6}.rule{stroke:#3d5b83;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1280"/>
  <text class="title" x="44" y="51">From research question to evidence-backed review</text>
  <text class="subtitle" x="44" y="78">A detailed walkthrough of the implemented SciSpace interview project · sample run: 373 candidates → 150 shortlisted → 40 selected → 12 cited</text>
  <rect x="1270" y="35" width="18" height="12" rx="3" fill="#203c64"/><text class="small" x="1297" y="46">compute / data step</text>
  <rect x="1432" y="35" width="18" height="12" rx="3" fill="#174c72"/><text class="small" x="1459" y="46">verified evidence</text>

  <!-- Discovery and ranking -->
  <rect class="panel" x="28" y="105" width="1544" height="423" rx="18"/>
  <text class="section" x="50" y="137">1 · Discover and rank candidates</text>
  <text class="small" x="1350" y="137" text-anchor="end">Cheap retrieval first; expensive judgment later</text>

  <rect class="card" x="48" y="165" width="190" height="225" rx="13"/>
  <text class="heading" x="66" y="195">Research topic</text>
  <text class="body" x="66" y="222"><tspan x="66">User submits topic and</tspan><tspan x="66" dy="19">optional year limits.</tspan></text>
  <line class="rule" x1="66" y1="267" x2="220" y2="267"/>
  <text class="small" x="66" y="292"><tspan x="66">Job request enters the API;</tspan><tspan x="66" dy="17">a worker runs it in the</tspan><tspan x="66" dy="17">background.</tspan></text>

  <path class="line" d="M240 278 H260"/>
  <rect class="card" x="267" y="165" width="190" height="225" rx="13"/>
  <text class="heading" x="285" y="195">Plan facets</text>
  <text class="body" x="285" y="222"><tspan x="285">Break topic into 4–8</tspan><tspan x="285" dy="19">sub-questions with</tspan><tspan x="285" dy="19">keyword phrases.</tspan></text>
  <line class="rule" x1="285" y1="285" x2="439" y2="285"/>
  <text class="small" x="285" y="310"><tspan x="285">Each facet supports coverage</tspan><tspan x="285" dy="17">and its own keyword/vector</tspan><tspan x="285" dy="17">retrieval list.</tspan></text>

  <path class="line" d="M459 278 H479"/>
  <rect class="card" x="486" y="165" width="210" height="225" rx="13"/>
  <text class="heading" x="504" y="195">Gather + snowball</text>
  <text class="body" x="504" y="222"><tspan x="504">Search local Postgres and</tspan><tspan x="504" dy="19">OpenAlex per facet.</tspan></text>
  <rect x="504" y="272" width="174" height="39" rx="8" fill="#172d4b" stroke="#5476a4"/>
  <text class="small" x="591" y="288" text-anchor="middle"><tspan x="591">Top early papers</tspan><tspan x="591" dy="15">↙ references · citing works ↗</tspan></text>
  <text class="small" x="504" y="337"><tspan x="504">OpenAlex links add candidates;</tspan><tspan x="504" dy="17">dedupe, apply filters, cap pool.</tspan></text>

  <path class="line" d="M698 278 H718"/>
  <rect class="accent" x="725" y="165" width="175" height="225" rx="13"/>
  <text class="heading" x="743" y="195">Candidate pool</text>
  <text class="metric" x="743" y="235">373 in sample</text>
  <text class="body" x="743" y="262"><tspan x="743">Up to 3,000 candidates.</tspan><tspan x="743" dy="20">Metadata, abstract, vector</tspan><tspan x="743" dy="20">and reference IDs are stored</tspan><tspan x="743" dy="20">in Postgres for reuse.</tspan></text>
  <text class="tiny" x="743" y="359">IDs deduplicated across sources</text>

  <path class="line" d="M902 278 H922"/>
  <rect class="card" x="929" y="165" width="235" height="225" rx="13"/>
  <text class="heading" x="947" y="195">Rank with three signals</text>
  <text class="body" x="947" y="224"><tspan x="947">BM25F · exact terms by field</tspan><tspan x="947" dy="21">Dense · semantic similarity</tspan><tspan x="947" dy="21">PageRank · citation context</tspan></text>
  <line class="rule" x1="947" y1="295" x2="1146" y2="295"/>
  <text class="small" x="947" y="318"><tspan x="947">Rocchio can refine facet vectors.</tspan><tspan x="947" dy="18">RRF merges rankings without</tspan><tspan x="947" dy="18">mixing incomparable score scales.</tspan></text>

  <path class="line" d="M1166 278 H1186"/>
  <rect class="card" x="1193" y="165" width="170" height="225" rx="13"/>
  <text class="heading" x="1211" y="195">Shortlist</text>
  <text class="metric" x="1211" y="235">150 papers</text>
  <text class="body" x="1211" y="264"><tspan x="1211">Highest fused ranks</tspan><tspan x="1211" dy="20">go to screening.</tspan></text>
  <text class="small" x="1211" y="329"><tspan x="1211">Cheap math scores all</tspan><tspan x="1211" dy="17">candidates in milliseconds.</tspan></text>

  <path class="line" d="M1365 278 H1385"/>
  <rect class="card" x="1392" y="165" width="160" height="225" rx="13"/>
  <text class="heading" x="1410" y="195">Screen + select</text>
  <text class="body" x="1410" y="224"><tspan x="1410">Judge verdicts</tspan><tspan x="1410" dy="18">weighed with Bayes.</tspan><tspan x="1410" dy="23">Submodular greedy</tspan><tspan x="1410" dy="18">balances relevance,</tspan><tspan x="1410" dy="18">facet coverage and</tspan><tspan x="1410" dy="18">redundancy.</tspan></text>
  <text class="metric" x="1410" y="363">40 selected</text>

  <rect class="card2" x="50" y="416" width="720" height="86" rx="11"/>
  <text class="heading" x="68" y="443">Citation network · current implementation</text>
  <text class="small" x="68" y="466"><tspan x="68">OpenAlex references become directed edges A → B (A cites B), only when both papers are in this pool.</tspan><tspan x="68" dy="17">NumPy edge list + personalized PageRank; no Neo4j or NetworkX. Seeded by top text-ranked papers.</tspan></text>
  <rect class="human" x="800" y="416" width="752" height="86" rx="11"/>
  <text class="heading" x="820" y="443">Human approval checkpoint</text>
  <text class="small" x="820" y="466"><tspan x="820">Optional pause after selection: reviewer can add or remove papers before full-text processing.</tspan><tspan x="820" dy="17">In the sample run approval is automatic; production jobs can wait for an explicit decision.</tspan></text>
  <path class="lineblue" d="M1470 392 V407"/>
  <path class="lineblue" d="M800 502 V536 H17 V710 H48"/>

  <!-- Evidence grounded writing -->
  <rect class="panel" x="28" y="548" width="1544" height="375" rx="18"/>
  <text class="section" x="50" y="581">2 · Read, ground and write</text>
  <text class="small" x="1350" y="581" text-anchor="end">Only selected papers reach the expensive reading and generation stages</text>

  <rect class="card" x="50" y="608" width="220" height="206" rx="13"/>
  <text class="heading" x="68" y="638">Ingest selected papers</text>
  <text class="body" x="68" y="668"><tspan x="68">Fetch arXiv PDFs where</tspan><tspan x="68" dy="19">available; otherwise use</tspan><tspan x="68" dy="19">the abstract.</tspan></text>
  <line class="rule" x1="68" y1="735" x2="252" y2="735"/>
  <text class="small" x="68" y="758"><tspan x="68">Split at headings; pack whole</tspan><tspan x="68" dy="17">sentences into ~500-token</tspan><tspan x="68" dy="17">chunks with overlap.</tspan></text>

  <path class="line" d="M272 710 H296"/>
  <rect class="card" x="303" y="608" width="190" height="206" rx="13"/>
  <text class="heading" x="321" y="638">Outline</text>
  <text class="body" x="321" y="668"><tspan x="321">Cluster selected papers</tspan><tspan x="321" dy="19">by text and shared</tspan><tspan x="321" dy="19">references; name sections.</tspan></text>
  <rect x="321" y="752" width="154" height="38" rx="8" fill="#172d4b" stroke="#5476a4"/>
  <text class="metric" x="398" y="777" text-anchor="middle">3 sections in sample</text>

  <path class="line" d="M495 710 H519"/>
  <rect class="card" x="526" y="608" width="220" height="206" rx="13"/>
  <text class="heading" x="544" y="638">Parallel section branches</text>
  <text class="body" x="544" y="668"><tspan x="544">LangGraph starts one branch</tspan><tspan x="544" dy="19">per section using Send.</tspan><tspan x="544" dy="23">Each branch retrieves its best</tspan><tspan x="544" dy="19">passages and packs them into</tspan><tspan x="544" dy="19">a 6,000-token budget.</tspan></text>

  <path class="line" d="M748 710 H772"/>
  <rect class="accent" x="779" y="608" width="220" height="206" rx="13"/>
  <text class="heading" x="797" y="638">Evidence cards</text>
  <text class="body" x="797" y="668"><tspan x="797">Each card stores a claim,</tspan><tspan x="797" dy="19">verbatim source quote, paper</tspan><tspan x="797" dy="19">and chunk, with an ID such</tspan><tspan x="797" dy="19">as [E2.3].</tspan></text>
  <line class="rule" x1="797" y1="758" x2="981" y2="758"/>
  <text class="metric" x="797" y="784">Code checks quote in source</text>

  <path class="line" d="M1001 710 H1025"/>
  <rect class="card" x="1032" y="608" width="220" height="206" rx="13"/>
  <text class="heading" x="1050" y="638">Write · verify · revise</text>
  <text class="body" x="1050" y="668"><tspan x="1050">Writer can cite only card IDs.</tspan><tspan x="1050" dy="23">Checker labels each sentence</tspan><tspan x="1050" dy="19">supported, partial or unsupported.</tspan><tspan x="1050" dy="23">Revise flagged claims up to</tspan><tspan x="1050" dy="19">2 rounds; then remove failures.</tspan></text>

  <path class="line" d="M1254 710 H1278"/>
  <rect class="card" x="1285" y="608" width="267" height="206" rx="13"/>
  <text class="heading" x="1303" y="638">Assemble deliverables</text>
  <text class="body" x="1303" y="668"><tspan x="1303">Join checked sections. Number</tspan><tspan x="1303" dy="19">references by first citation.</tspan><tspan x="1303" dy="23">Build bibliography from OpenAlex</tspan><tspan x="1303" dy="19">metadata, not model-written refs.</tspan></text>
  <line class="rule" x1="1303" y1="758" x2="1534" y2="758"/>
  <text class="metric" x="1303" y="784">Review + references + report</text>

  <path class="dash" d="M633 828 V858 H1140 V828"/>
  <text class="small" x="886" y="879" text-anchor="middle">Section branches checkpoint independently; finished sections are assembled after all branches complete.</text>

  <!-- Runtime and evaluation -->
  <rect class="panel" x="28" y="943" width="1544" height="285" rx="18"/>
  <text class="section" x="50" y="977">3 · Run reliably and measure quality</text>
  <rect class="card2" x="50" y="1001" width="946" height="190" rx="13"/>
  <text class="heading" x="70" y="1030">Production shell</text>
  <rect class="card" x="70" y="1050" width="170" height="73" rx="9"/>
  <text class="heading" x="155" y="1078" text-anchor="middle">Client</text><text class="small" x="155" y="1100" text-anchor="middle">POST topic → job ID</text>
  <path class="line" d="M242 1086 H266"/>
  <rect class="card" x="273" y="1050" width="175" height="73" rx="9"/>
  <text class="heading" x="360" y="1078" text-anchor="middle">FastAPI</text><text class="small" x="360" y="1100" text-anchor="middle">auth · status · results</text>
  <path class="line" d="M450 1086 H474"/>
  <rect class="card" x="481" y="1050" width="200" height="73" rx="9"/>
  <text class="heading" x="581" y="1078" text-anchor="middle">Postgres queue</text><text class="small" x="581" y="1100" text-anchor="middle">SKIP LOCKED · job data</text>
  <path class="line" d="M683 1086 H707"/>
  <rect class="card" x="714" y="1050" width="250" height="73" rx="9"/>
  <text class="heading" x="839" y="1078" text-anchor="middle">Worker + LangGraph</text><text class="small" x="839" y="1100" text-anchor="middle">leases · retries · node checkpoints</text>
  <path class="lineblue" d="M840 1048 V1038 H581 V1048"/>
  <text class="tiny" x="704" y="1036" text-anchor="middle">save checkpoints / results</text>
  <text class="small" x="70" y="1157"><tspan x="70">A dead worker's lease expires; another resumes from the last checkpoint. Logs, metrics and per-job traces show cost and timing.</tspan><tspan x="70" dy="18">Postgres holds the queue, job state, pgvector paper/chunk store and outputs. External calls: OpenAlex · arXiv · offline rules or Claude.</tspan></text>

  <rect class="accent" x="1018" y="1001" width="534" height="190" rx="13"/>
  <text class="heading" x="1040" y="1030">Evaluation loop</text>
  <text class="body" x="1040" y="1057"><tspan x="1040">8 published surveys across 7 fields act as answer keys.</tspan><tspan x="1040" dy="20">Measure recall@150 and nDCG@100 for ranking; compare</tspan><tspan x="1040" dy="20">selection methods on recall@40 and diversity.</tspan></text>
  <line class="rule" x1="1040" y1="1121" x2="1530" y2="1121"/>
  <text class="metric" x="1040" y="1147">+0.050 nDCG@100 adding PageRank · p = 0.014</text>
  <text class="small" x="1040" y="1172">Low absolute recall (~0.25 at 150) remains a known planner limitation.</text>

  <text class="tiny" x="50" y="1255">Design note: HNSW is the vector index in pgvector; the citation network is a separate in-memory paper graph used for personalized PageRank.</text>
</svg>
