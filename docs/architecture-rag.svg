<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif" role="img">
  <title>Research assistant architecture</title>
  <desc>Indexing pipeline: papers are chunked by section, embedded, and indexed into a Postgres vector store with a keyword index. Query side: the topic becomes facet queries that search the store; candidates are ranked and narrowed to about 40 papers; passages are packed into evidence cards; a LangGraph agent writes and checks each section; the cited paper goes back to the user.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#14284a"/>

  <!-- indexing region -->
  <rect x="30" y="24" width="1140" height="196" rx="18" fill="none" stroke="#9db8de" stroke-width="1.5" stroke-dasharray="8 7"/>
  <text x="56" y="58" fill="#ffffff" font-size="22" font-weight="bold">Indexing pipeline</text>
  <text x="250" y="58" fill="#9db8de" font-size="15">runs ahead of time; papers found by jobs are added too</text>

  <rect x="56" y="88" width="210" height="96" rx="12" fill="#24477a"/>
  <text x="76" y="128" fill="#ffffff" font-size="20" font-weight="bold">Papers</text>
  <text x="76" y="154" fill="#cfe0f7" font-size="14">OpenAlex + arXiv</text>
  <rect x="206" y="104" width="38" height="48" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
  <rect x="214" y="112" width="38" height="48" rx="4" fill="#24477a" stroke="#ffffff" stroke-width="2"/>
  <line x1="221" y1="125" x2="245" y2="125" stroke="#ffffff" stroke-width="2"/>
  <line x1="221" y1="135" x2="245" y2="135" stroke="#ffffff" stroke-width="2"/>
  <line x1="221" y1="145" x2="238" y2="145" stroke="#ffffff" stroke-width="2"/>

  <line x1="272" y1="136" x2="344" y2="136" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="308" y="122" fill="#5aa8ff" font-size="15" text-anchor="middle">Chunking</text>

  <rect x="352" y="88" width="230" height="96" rx="12" fill="#24477a"/>
  <text x="372" y="128" fill="#ffffff" font-size="20" font-weight="bold">Chunks</text>
  <text x="372" y="154" fill="#cfe0f7" font-size="14">split by section</text>
  <rect x="486" y="108" width="80" height="9" fill="#4f93e6"/>
  <rect x="486" y="122" width="80" height="9" fill="#4f93e6"/>
  <rect x="486" y="136" width="80" height="9" fill="#4f93e6"/>
  <rect x="486" y="150" width="80" height="9" fill="#4f93e6"/>

  <line x1="588" y1="136" x2="652" y2="136" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="620" y="122" fill="#5aa8ff" font-size="15" text-anchor="middle">Embed</text>

  <rect x="660" y="88" width="250" height="96" rx="12" fill="#24477a"/>
  <text x="680" y="128" fill="#ffffff" font-size="18" font-weight="bold">Embedding model</text>
  <text x="680" y="154" fill="#cfe0f7" font-size="14">bge-small, 384-d, on CPU</text>
  <g stroke="#9db8de" stroke-width="1.2">
    <line x1="862" y1="108" x2="882" y2="122"/><line x1="862" y1="108" x2="882" y2="146"/>
    <line x1="862" y1="136" x2="882" y2="122"/><line x1="862" y1="136" x2="882" y2="146"/>
    <line x1="862" y1="164" x2="882" y2="122"/><line x1="862" y1="164" x2="882" y2="146"/>
    <line x1="882" y1="122" x2="898" y2="136"/><line x1="882" y1="146" x2="898" y2="136"/>
  </g>
  <g fill="#ffffff"><circle cx="862" cy="108" r="5"/><circle cx="862" cy="136" r="5"/><circle cx="862" cy="164" r="5"/>
    <circle cx="882" cy="122" r="5"/><circle cx="882" cy="146" r="5"/><circle cx="898" cy="136" r="5"/></g>

  <line x1="916" y1="136" x2="978" y2="136" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="946" y="122" fill="#5aa8ff" font-size="15" text-anchor="middle">Vectorize</text>

  <rect x="986" y="88" width="160" height="96" rx="12" fill="#24477a"/>
  <g fill="#4f93e6" stroke="#14284a" stroke-width="1.5">
    <rect x="1004" y="106" width="24" height="22"/><rect x="1028" y="106" width="24" height="22"/><rect x="1052" y="106" width="24" height="22"/><rect x="1076" y="106" width="24" height="22"/><rect x="1100" y="106" width="24" height="22"/>
    <rect x="1004" y="128" width="24" height="22" fill="#3a7bd0"/><rect x="1028" y="128" width="24" height="22" fill="#3a7bd0"/><rect x="1052" y="128" width="24" height="22" fill="#3a7bd0"/><rect x="1076" y="128" width="24" height="22" fill="#3a7bd0"/><rect x="1100" y="128" width="24" height="22" fill="#3a7bd0"/>
  </g>
  <text x="1066" y="172" fill="#cfe0f7" font-size="14" text-anchor="middle">vectors</text>

  <line x1="1066" y1="188" x2="1066" y2="250" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="1078" y="244" fill="#5aa8ff" font-size="15">Index</text>

  <!-- vector store (cylinder) -->
  <path d="M960 276 L960 384 A106 18 0 0 0 1172 384 L1172 276" fill="#24477a" stroke="#ffffff" stroke-width="2"/>
  <ellipse cx="1066" cy="276" rx="106" ry="18" fill="#2f5a95" stroke="#ffffff" stroke-width="2"/>
  <text x="1066" y="318" fill="#ffffff" font-size="19" font-weight="bold" text-anchor="middle">Vector store</text>
  <text x="1066" y="342" fill="#cfe0f7" font-size="14" text-anchor="middle">pgvector HNSW in Postgres</text>
  <text x="1066" y="362" fill="#cfe0f7" font-size="14" text-anchor="middle">+ keyword index, filters</text>

  <!-- query side -->
  <rect x="40" y="292" width="170" height="80" rx="12" fill="#24477a"/>
  <text x="125" y="328" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">User</text>
  <text x="125" y="352" fill="#cfe0f7" font-size="14" text-anchor="middle">a research topic</text>
  <line x1="216" y1="332" x2="268" y2="332" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>

  <rect x="276" y="292" width="270" height="80" rx="12" fill="#24477a"/>
  <text x="411" y="328" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">Query transform</text>
  <text x="411" y="352" fill="#cfe0f7" font-size="14" text-anchor="middle">facets + Rocchio feedback</text>

  <line x1="552" y1="332" x2="952" y2="332" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="752" y="318" fill="#5aa8ff" font-size="15" text-anchor="middle">Search: vector + keyword + OpenAlex + citations</text>

  <line x1="1066" y1="404" x2="1066" y2="446" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="1078" y="430" fill="#5aa8ff" font-size="15">Retrieve</text>

  <rect x="900" y="454" width="270" height="130" rx="12" fill="#24477a"/>
  <text x="1035" y="486" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">Rank + select</text>
  <text x="1035" y="512" fill="#cfe0f7" font-size="14" text-anchor="middle">BM25F, cosine, PageRank, RRF</text>
  <text x="1035" y="534" fill="#cfe0f7" font-size="14" text-anchor="middle">Bayes judge, submodular or DPP</text>
  <text x="1035" y="562" fill="#5aa8ff" font-size="15" font-weight="bold" text-anchor="middle">about 2,000 to 40 papers</text>

  <line x1="894" y1="519" x2="834" y2="519" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="864" y="505" fill="#5aa8ff" font-size="15" text-anchor="middle">Passages</text>

  <rect x="580" y="474" width="246" height="90" rx="12" fill="#24477a"/>
  <text x="703" y="506" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">Augment</text>
  <text x="703" y="530" fill="#cfe0f7" font-size="14" text-anchor="middle">budgeted evidence cards</text>
  <text x="703" y="550" fill="#cfe0f7" font-size="14" text-anchor="middle">exact quotes + card ids</text>

  <!-- agent region -->
  <rect x="262" y="410" width="290" height="270" rx="16" fill="none" stroke="#9db8de" stroke-width="1.5" stroke-dasharray="8 7"/>
  <text x="282" y="440" fill="#ffffff" font-size="17" font-weight="bold">LangGraph agent</text>
  <text x="282" y="460" fill="#9db8de" font-size="13">one copy per section, in parallel</text>
  <line x1="574" y1="519" x2="532" y2="519" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
  <rect x="286" y="480" width="240" height="70" rx="12" fill="#2f5a95"/>
  <text x="406" y="510" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">LLM writer</text>
  <text x="406" y="532" fill="#cfe0f7" font-size="14" text-anchor="middle">cites card ids like [E2.3]</text>
  <line x1="372" y1="556" x2="372" y2="592" stroke="#ffffff" stroke-width="2" marker-end="url(#head)"/>
  <line x1="440" y1="592" x2="440" y2="556" stroke="#ffffff" stroke-width="2" marker-end="url(#head)"/>
  <text x="364" y="580" fill="#5aa8ff" font-size="13" text-anchor="end">check</text>
  <text x="450" y="580" fill="#5aa8ff" font-size="13">revise, max 2</text>
  <rect x="286" y="598" width="240" height="70" rx="12" fill="#2f5a95"/>
  <text x="406" y="628" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">Citation check</text>
  <text x="406" y="650" fill="#cfe0f7" font-size="14" text-anchor="middle">deletes unsupported claims</text>

  <line x1="280" y1="633" x2="198" y2="633" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
  <text x="232" y="619" fill="#5aa8ff" font-size="13" text-anchor="middle">Generate</text>
  <rect x="40" y="593" width="150" height="80" rx="12" fill="#24477a"/>
  <text x="115" y="627" fill="#ffffff" font-size="20" font-weight="bold" text-anchor="middle">Response</text>
  <text x="115" y="651" fill="#cfe0f7" font-size="14" text-anchor="middle">paper + references</text>
  <line x1="115" y1="587" x2="115" y2="380" stroke="#ffffff" stroke-width="2.5" marker-end="url(#head)"/>
</svg>
