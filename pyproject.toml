[project]
name = "research-assistant"
version = "0.1.0"
description = "Picks the most relevant papers with hand-written ranking math, then writes a citation-checked review with a LangGraph agent."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.14,<2",
    "fastapi>=0.143",
    "fastembed>=0.9",
    "httpx>=0.28",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "numpy>=2.5",
    "pgvector>=0.5",
    "prometheus-client>=0.26",
    "psycopg[binary,pool]>=3.3",
    "pydantic-settings>=2.16",
    "pypdf>=6.20",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
lab = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not db and not network and not slow'"
markers = [
    "db: needs the Postgres from docker compose (run: uv run pytest -m db)",
    "network: calls live external APIs (never part of the default run)",
    "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]  # zip() without strict= is fine here; lengths are checked where it matters

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
